version: 2

sources:
  - name: jaffle_shop
    database: RAW
    schema: JAFFLE_SHOP
    tables:
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

      - name: orders
        columns:
          - name: id
            data_tests:
            - unique
            - not_null
          - name: user_id
            data_tests:
              - not_null